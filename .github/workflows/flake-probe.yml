name: flake-probe (temporal)

on:
  push:
    branches: [flake-probe]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud_worker/package-lock.json
      - name: Instalar dependencias
        run: |
          pip install -r requirements-dev.txt
          npm ci --prefix cloud_worker
      - name: Repetir pytest 14 veces y anotar cada fallo
        env:
          REQUIRE_UI_TESTS: "1"
          NODE_PATH: ${{ github.workspace }}/cloud_worker/node_modules
        run: |
          fails=0
          for i in $(seq 1 14); do
            start=$(date -u +%H:%M:%S)
            if ! python -m pytest -q -rfE --tb=short --durations=5 -p no:cacheprovider > "$RUNNER_TEMP/p$i.log" 2>&1; then
              fails=$((fails+1))
              python - "$RUNNER_TEMP/p$i.log" "$i" "$start" <<'PY'
          import sys, pathlib
          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")[-6000:]
          head = f"[iteracion {sys.argv[2]}, inicio {sys.argv[3]} UTC]\n"
          enc = (head + text).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=pytest fallo (iteracion " + sys.argv[2] + ")::" + enc)
          PY
            else
              echo "iteracion $i OK ($start)"; tail -n 1 "$RUNNER_TEMP/p$i.log"
            fi
          done
          echo "fallos: $fails de 14"
          [ "$fails" -eq 0 ]
