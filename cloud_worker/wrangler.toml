# ParkingManager cloud service (Cloudflare Workers + D1). See DEPLOY.md.
name = "parking-cloud"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Static files (customer page + monitor panel): generated into ./public by
# `npm run prepare-public` from ../github_pages and ./monitor.
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "parking"
# Replace with the id printed by `npx wrangler d1 create parking` (see DEPLOY.md).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Secrets are NOT written here. Set them with:
#   npx wrangler secret put INGEST_SECRET   (the password the parking PC uses)
#   npx wrangler secret put SETUP_TOKEN     (one-time password for creating the owner key)
